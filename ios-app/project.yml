name: BoostHubVPN

options:
  bundleIdPrefix: com.boosthub
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: "29U8L34KC9"
    CODE_SIGN_STYLE: "Automatic"

packages:
  Lottie:
    url: https://github.com/airbnb/lottie-ios.git
    from: 4.5.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

targets:
  BoostHubVPN:
    type: application
    platform: iOS
    sources:
      - path: BoostHubVPN
        includes:
          - OfferModel.swift
          - OfferOverlay.swift
          - BoostHubVPNApp.swift
          - Auth/SupabaseAuthManager.swift
          - Views/LoginView.swift
          - Views/SignUpView.swift
          - Views/ProfileView.swift
          - Views/DiagnosticsView.swift
          - Assets.xcassets
      - path: ../public
        includes:
          - Boost.lottie
    settings:
      base:
        INFOPLIST_FILE: BoostHubVPN/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.boosthub.vpn
        CODE_SIGN_ENTITLEMENTS: BoostHubVPN/App/BoostHubVPN.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    dependencies:
      - target: BoostHubTunnel
        embed: true
      - package: Lottie
      - package: ZIPFoundation

  BoostHubTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: BoostHubVPN
        includes:
          - VPNLiberTunnelProvider.swift
          - OfferModel.swift
    settings:
      base:
        INFOPLIST_FILE: BoostHubVPN/Tunnel/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.boosthub.vpn.packet-tunnel
        CODE_SIGN_ENTITLEMENTS: BoostHubVPN/Tunnel/BoostHubTunnel.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        SKIP_INSTALL: "YES"